<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday My Baby Aina</title>
  <style>
    /* Gradient Background: Teal Blue Mix Light Green */
    body {
      margin: 0;
      padding: 20px 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #008080, #a8e6cf);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #2c3e50;
      overflow-x: hidden;
      position: relative;
    }

    /* Efek Hati Gugur (Floating Hearts) */
    .heart-particle {
      position: absolute;
      top: -10px;
      color: rgba(255, 77, 109, 0.6);
      font-size: 20px;
      user-select: none;
      pointer-events: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(360deg);
      }
    }

    /* Container Kad Utama */
    .card {
      background: rgba(255, 255, 255, 0.94);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 420px;
      width: 90%;
      z-index: 10;
    }

    h1 {
      color: #006666;
      font-size: 1.6rem;
      margin-bottom: 5px;
    }

    h2 {
      color: #e74c3c;
      font-size: 1.2rem;
      margin-top: 0;
    }

    /* Frame Gambar / Slideshow Effect */
    .slideshow-container {
      position: relative;
      width: 100%;
      height: 280px;
      margin: 15px 0;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      border: 4px solid #ffffff;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.1); /* Ken Burns effect (Zoom out sikit) */
      transition: opacity 1.5s ease-in-out, transform 4s ease-out;
    }

    .slide.active {
      opacity: 1;
      transform: scale(1);
    }

    /* Mesej Cinta */
    .love-message {
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 15px 0;
      color: #34495e;
      text-align: center;
    }

    .love-message span {
      display: block;
      font-weight: bold;
      color: #d63031;
      font-size: 1.1rem;
      margin-top: 8px;
    }

    /* Countdown Timer Box */
    .timer-container {
      background: #e0f2f1;
      border: 1px solid #80cbc4;
      border-radius: 12px;
      padding: 12px;
      margin-top: 15px;
    }

    .timer-title {
      font-size: 0.85rem;
      color: #004d40;
      margin-bottom: 5px;
    }

    .timer {
      font-weight: bold;
      font-size: 1.05rem;
      color: #00796b;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Para El Amor De Mi Vida ❤️</h1>
    <h2>Untuk My Baby Aina</h2>

    <div class="slideshow-container">
      <img class="slide active" src="gambar1.jpg" alt="Dating 1">
      <img class="slide" src="gambar2.jpg" alt="Dating 2">
      <img class="slide" src="gambar3.jpg" alt="Gambar Random Aina">
      <img class="slide" src="gambar4.jpg" alt="Sweet Moment">
    </div>

    <div class="love-message">
      Setiap kenangan dan detik dating dengan <b>My Baby Aina</b> selalu buat saya tersenyum. Terima kasih sebab sentiasa ada dan menceriakan hidup saya!
      <span>¡Te amo sangat-sangat! 💖</span>
    </div>

    <div class="timer-container">
      <div class="timer-title">Menghitung hari ke ulang tahun kelahiran... 🎂</div>
      <div id="countdown" class="timer">Membaca masa...</div>
    </div>
  </div>

  <script>
    // 1. Logic Slideshow Gambar Automatik
    const slides = document.querySelectorAll('.slide');
    let currentSlide = 0;

    function nextSlide() {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }

    // Gambar bertukar setiap 3.5 saat
    setInterval(nextSlide, 3500);

    // 2. Logic Efek Hati Gugur
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart-particle');
      heart.innerHTML = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 3 + 2 + 's';
      heart.style.fontSize = Math.random() * 15 + 10 + 'px';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

    setInterval(createHeart, 300);

    // 3. Logic Countdown Timer (26 Sept)
    function updateCountdown() {
      const now = new Date();
      let currentYear = now.getFullYear();
      let birthday = new Date(currentYear, 8, 26); // 8 = September

      if (now > birthday) {
        birthday = new Date(currentYear + 1, 8, 26);
      }

      const diff = birthday - now;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById("countdown").innerHTML = 
        `${days} Hari ${hours} Jam ${minutes} Minit ${seconds} Saat`;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
